# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main.
# Requires: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
#
# The site URL and base path are derived automatically:
#   • repo named <owner>.github.io  → https://<owner>.github.io/            (base "/")
#   • any other repo name           → https://<owner>.github.io/<repo>/     (base "/<repo>/")
#   • public/CNAME present          → https://<that domain>/                (base "/")
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve site URL and base path
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ]; then
            BASE="/"; SITE_URL="https://$(tr -d '[:space:]' < public/CNAME)/"
          elif [ "${REPO}" = "${OWNER}.github.io" ]; then
            BASE="/"; SITE_URL="https://${OWNER}.github.io/"
          else
            BASE="/${REPO}/"; SITE_URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "BASE_PATH=${BASE}" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "Deploying to ${SITE_URL} (base ${BASE})"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
