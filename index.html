  <!-- Progressive enhancement gates. Scroll-reveal and the loading screen are opt-in:
       only when JS runs, the APIs exist and the visitor hasn't asked for reduced motion. -->
  <script>
    (function () {
      var root = document.documentElement;
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if ('IntersectionObserver' in window && !reduce) root.classList.add('js-reveal');
      if (!reduce) root.classList.add('js-loader');
    })();
  </script>

  <!-- Loading screen: static markup + inline CSS so it paints with the first frame and
       lifts on its own timer (~1.1 s) without waiting for the JS bundle. App.jsx removes
       the node afterwards. Hidden entirely without JS or with reduced motion. -->
  <style>
    .loader { display: none; }
    .js-loader .loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #FAFAF9;
      animation: loader-out 400ms cubic-bezier(0.16, 1, 0.3, 1) 750ms forwards;
    }
    .loader__mark {
      width: 72px; height: 72px;
      filter: drop-shadow(0 12px 28px rgb(0 0 0 / 0.18));
      animation: loader-pulse 1.15s cubic-bezier(0.4, 0, 0.2, 1) 1;
    }
    .loader__bg { fill: #111113; }
    .loader__text { fill: #FAFAF9; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .loader__bar { fill: #0F766E; transform-origin: 32px 49.5px; animation: loader-bar 1.15s cubic-bezier(0.4, 0, 0.2, 1) 1; }
    @media (prefers-color-scheme: dark) {
      .js-loader .loader { background: #0C0D0D; }
      .loader__bg { fill: #EDEDEA; }
      .loader__text { fill: #0C0D0D; }
      .loader__bar { fill: #2DD4BF; }
    }
    @media (max-width: 600px) { .loader__mark { width: 56px; height: 56px; } }
    @keyframes loader-out { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    @keyframes loader-pulse {
      0% { opacity: 0.55; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.55; transform: scale(0.95); }
    }
    @keyframes loader-bar { 0%, 100% { transform: scaleX(0.35); } 50% { transform: scaleX(1); } }
  </style>
